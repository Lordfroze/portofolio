<svg width="600" height="450" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1f27;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#262b33;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="soil" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#3d2b1f;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#5c4033;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="leaf" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#16a34a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#15803d;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="600" height="450" fill="url(#bg)" />
  <!-- Soil -->
  <rect x="0" y="350" width="600" height="100" fill="url(#soil)"/>
  <!-- Plants -->
  <g fill="url(#leaf)">
    <ellipse cx="100" cy="320" rx="30" ry="50"/>
    <ellipse cx="150" cy="300" rx="25" ry="45"/>
    <ellipse cx="200" cy="330" rx="30" ry="55"/>
    <ellipse cx="280" cy="310" rx="28" ry="50"/>
    <ellipse cx="350" cy="325" rx="30" ry="55"/>
    <ellipse cx="420" cy="305" rx="25" ry="45"/>
    <ellipse cx="480" cy="330" rx="30" ry="50"/>
    <ellipse cx="530" cy="315" rx="28" ry="55"/>
  </g>
  <!-- Plant rows -->
  <line x1="80" y1="350" x2="80" y2="450" stroke="#3d2b1f" stroke-width="2" opacity="0.5"/>
  <line x1="180" y1="350" x2="180" y2="450" stroke="#3d2b1f" stroke-width="2" opacity="0.5"/>
  <line x1="280" y1="350" x2="280" y2="450" stroke="#3d2b1f" stroke-width="2" opacity="0.5"/>
  <line x1="380" y1="350" x2="380" y2="450" stroke="#3d2b1f" stroke-width="2" opacity="0.5"/>
  <line x1="480" y1="350" x2="480" y2="450" stroke="#3d2b1f" stroke-width="2" opacity="0.5"/>
</svg>